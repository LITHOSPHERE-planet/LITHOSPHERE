name: Monthly competitor archive
on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monthly-wayback
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Submit and verify captures
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python3 web-archive/archive.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayback-log
          path: web-archive/archive-log.csv
          retention-days: 90
