name: Every two days competitor archive
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monthly-wayback
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check continuous two-day cadence
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ $(( $(date -u +%s) / 86400 % 2 )) -eq 0 ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cadence.outputs.run == 'true'
      - name: Submit and verify captures
        if: steps.cadence.outputs.run == 'true'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python3 web-archive/archive.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.cadence.outputs.run == 'true'
        with:
          name: wayback-log
          path: web-archive/archive-log.csv
          retention-days: 90
